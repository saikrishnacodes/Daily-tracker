<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Daily</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --ink: #1c1c1c;
    --muted: #9a9590;
    --line: #e8e3da;
    --accent: #1c1c1c;
    --done: #b5ddc8;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* HEADER */
  .header {
    padding: 56px 28px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .greeting {
    font-family: var(--serif);
    font-size: 30px;
    letter-spacing: -0.3px;
    line-height: 1.1;
    margin-bottom: 5px;
  }
  .sub-date {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }
  .streak-pill {
    background: var(--ink);
    color: var(--bg);
    border-radius: 14px;
    padding: 10px 18px;
    text-align: center;
    min-width: 68px;
  }
  .streak-num {
    font-family: var(--serif);
    font-size: 26px;
    line-height: 1;
  }
  .streak-lbl {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 2px;
    font-weight: 400;
  }

  /* PROGRESS */
  .progress-wrap {
    padding: 0 28px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-fill.all-done { background: #5ab585; }
  .progress-text {
    font-size: 12px;
    color: var(--muted);
    min-width: 44px;
    text-align: right;
    font-weight: 300;
  }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    margin: 0 28px 4px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 0;
    margin-right: 28px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 400;
    letter-spacing: 0.01em;
    transition: color 0.2s;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* CONTENT */
  .content { padding: 16px 28px; }

  /* SUCCESS BANNER */
  .success-banner {
    background: #e6f5ee;
    color: #2e7a50;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 14px;
    text-align: center;
    letter-spacing: 0.02em;
    margin-bottom: 22px;
    font-weight: 400;
  }

  /* TASKS */
  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    transition: opacity 0.3s;
  }
  .task-row.done { opacity: 0.38; }
  .checkbox {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1.5px solid var(--ink);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
    font-size: 13px;
    color: var(--bg);
    font-weight: 600;
  }
  .checkbox.checked { background: var(--ink); }
  .task-label {
    flex: 1;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 300;
    transition: text-decoration 0.2s;
  }
  .task-label.done { text-decoration: line-through; }
  .remove-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 22px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    font-weight: 300;
  }

  /* ADD TASK */
  .add-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    align-items: center;
  }
  .add-input {
    flex: 1;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    font-size: 16px;
    font-family: var(--sans);
    font-weight: 300;
    color: var(--ink);
    padding: 8px 0;
    outline: none;
  }
  .add-input::placeholder { color: var(--muted); }
  .add-input:focus { border-bottom-color: var(--ink); }
  .add-btn {
    width: 38px;
    height: 38px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    flex-shrink: 0;
  }

  /* NOTIF BUTTON */
  .notif-btn {
    margin-top: 32px;
    width: 100%;
    padding: 15px;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--sans);
    letter-spacing: 0.03em;
    font-weight: 300;
  }

  /* HISTORY */
  .history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .history-date {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .history-tasks {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    font-weight: 300;
    max-width: 240px;
  }
  .history-streak-num {
    font-family: var(--serif);
    font-size: 22px;
    text-align: center;
    display: block;
  }
  .history-streak-lbl {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    text-align: center;
  }
  .empty-msg {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-top: 50px;
    font-weight: 300;
    line-height: 1.6;
  }

  /* hidden views */
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="greeting" id="greeting">Good morning</div>
    <div class="sub-date" id="subdate"></div>
  </div>
  <div class="streak-pill">
    <div class="streak-num" id="streak-num">0</div>
    <div class="streak-lbl">day streak</div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progress-text">0/0 done</div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('today')">Today</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>

<!-- TODAY VIEW -->
<div class="view active content" id="view-today">
  <div class="success-banner" id="success-banner" style="display:none">✦ All tasks complete — great work.</div>
  <div id="task-list"></div>
  <div class="add-row">
    <input class="add-input" id="new-task-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()"/>
    <button class="add-btn" onclick="addTask()">+</button>
  </div>
  <button class="notif-btn" id="notif-btn" onclick="requestNotifications()" style="display:none">🔔 Enable reminders</button>
</div>

<!-- HISTORY VIEW -->
<div class="view content" id="view-history">
  <div id="history-list"></div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────
const DEFAULT_TASKS = [
  { id: "1", label: "Morning stretch" },
  { id: "2", label: "Drink 2L water" },
  { id: "3", label: "Read 20 minutes" },
];

let state = {
  tasks: [],          // {id, label, done}
  streak: 0,
  lastCompleted: null,
  history: [],        // [{date, tasks[], streak}]
};

function todayKey() {
  return new Date().toISOString().split("T")[0];
}

function saveState() {
  localStorage.setItem("dt_state", JSON.stringify(state));
}

function loadState() {
  try {
    const raw = localStorage.getItem("dt_state");
    if (!raw) {
      state.tasks = DEFAULT_TASKS.map(t => ({ ...t, done: false }));
      saveState();
      return;
    }
    state = JSON.parse(raw);

    // New day — reset done flags
    const today = todayKey();
    const lastDate = state._lastDate;
    if (lastDate !== today) {
      state.tasks = state.tasks.map(t => ({ ...t, done: false }));
      state._lastDate = today;
      saveState();
    }
  } catch(e) {
    state.tasks = DEFAULT_TASKS.map(t => ({ ...t, done: false }));
  }
}

// ─── GREETING ────────────────────────────────────────────
function setGreeting() {
  const h = new Date().getHours();
  let g = "Good evening";
  if (h >= 5 && h < 12) g = "Good morning";
  else if (h >= 12 && h < 17) g = "Good afternoon";
  else if (h < 5) g = "Still up?";
  document.getElementById("greeting").textContent = g;

  const d = new Date().toLocaleDateString("en-US", {
    weekday: "long", month: "long", day: "numeric"
  });
  document.getElementById("subdate").textContent = d;
}

// ─── RENDER ──────────────────────────────────────────────
function render() {
  // streak
  document.getElementById("streak-num").textContent = state.streak;

  // progress
  const total = state.tasks.length;
  const done = state.tasks.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const fill = document.getElementById("progress-fill");
  fill.style.width = pct + "%";
  fill.classList.toggle("all-done", done === total && total > 0);
  document.getElementById("progress-text").textContent = `${done}/${total} done`;

  // success banner
  const banner = document.getElementById("success-banner");
  banner.style.display = (done === total && total > 0) ? "block" : "none";

  // tasks
  const list = document.getElementById("task-list");
  list.innerHTML = "";
  state.tasks.forEach(task => {
    const row = document.createElement("div");
    row.className = "task-row" + (task.done ? " done" : "");
    row.innerHTML = `
      <button class="checkbox ${task.done ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
        ${task.done ? "✓" : ""}
      </button>
      <span class="task-label ${task.done ? 'done' : ''}">${escHtml(task.label)}</span>
      <button class="remove-btn" onclick="removeTask('${task.id}')">×</button>
    `;
    list.appendChild(row);
  });

  // notification button
  const nb = document.getElementById("notif-btn");
  if ("Notification" in window && Notification.permission !== "granted") {
    nb.style.display = "block";
  } else {
    nb.style.display = "none";
  }

  // history
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("history-list");
  list.innerHTML = "";
  if (state.history.length === 0) {
    list.innerHTML = `<p class="empty-msg">No history yet.<br>Complete your first full day to start tracking.</p>`;
    return;
  }
  state.history.forEach(entry => {
    const row = document.createElement("div");
    row.className = "history-row";
    const d = new Date(entry.date + "T12:00:00").toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    });
    row.innerHTML = `
      <div>
        <div class="history-date">${d}</div>
        <div class="history-tasks">${entry.tasks.map(escHtml).join(" · ")}</div>
      </div>
      <div>
        <span class="history-streak-num">${entry.streak}</span>
        <span class="history-streak-lbl">streak</span>
      </div>
    `;
    list.appendChild(row);
  });
}

// ─── ACTIONS ─────────────────────────────────────────────
function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;

  // Check if all done
  const allDone = state.tasks.length > 0 && state.tasks.every(t => t.done);
  if (allDone) {
    const today = todayKey();
    if (state.lastCompleted !== today) {
      // Calculate streak
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yKey = yesterday.toISOString().split("T")[0];
      state.streak = (state.lastCompleted === yKey) ? state.streak + 1 : 1;
      state.lastCompleted = today;

      // Save history entry
      const entry = {
        date: today,
        tasks: state.tasks.map(t => t.label),
        streak: state.streak,
      };
      state.history = [entry, ...state.history].slice(0, 90);

      // Notification
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("🎉 Day complete!", {
          body: `${state.streak} day streak! All tasks done.`,
          icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>"
        });
      }
    }
  }

  saveState();
  render();
}

function removeTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  render();
}

function addTask() {
  const input = document.getElementById("new-task-input");
  const label = input.value.trim();
  if (!label) return;
  state.tasks.push({ id: Date.now().toString(), label, done: false });
  input.value = "";
  saveState();
  render();
}

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active", (i === 0 && tab === "today") || (i === 1 && tab === "history"));
  });
  document.getElementById("view-today").classList.toggle("active", tab === "today");
  document.getElementById("view-history").classList.toggle("active", tab === "history");
}

async function requestNotifications() {
  if (!("Notification" in window)) return;
  const perm = await Notification.requestPermission();
  if (perm === "granted") {
    new Notification("Daily Tracker", {
      body: "You'll get a notification when all tasks are done!"
    });
  }
  render();
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── INIT ────────────────────────────────────────────────
loadState();
setGreeting();
render();
</script>
</body>
</html>
